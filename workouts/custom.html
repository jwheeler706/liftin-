<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Custom Workout</title>
<meta name="theme-color" content="#ff7a45">
<meta name="apple-mobile-web-app-title" content="Liftin'">
<link rel="manifest" href="../manifest.json">
<link rel="icon" href="../assets/icons/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Roboto+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/workout-app.css">
</head>
<body>
<script>
  const customPlanKey = 'standalone-lift-custom-workout-plan';
  document.body.classList.add(localStorage.getItem(customPlanKey) ? 'custom-ready' : 'custom-empty');
</script>
<div class="back-bar"><a href="../index.html" aria-label="Back to Lift">&#8249;</a></div>
<div class="workout-clock" aria-live="polite">
  <span>Workout</span>
  <strong id="workoutElapsed">00:00</strong>
</div>

<header class="hero">
  <h1>Custom <span>Workout</span></h1>
  <div class="meta">
    <span>Build on the fly</span>
    <span id="customWorkoutCount">0 exercises</span>
  </div>
</header>

<section class="builder-panel" id="builderPanel">
  <div class="builder-head">
    <div>
      <div class="label">Builder</div>
      <h2>Today&apos;s Plan</h2>
    </div>
    <button type="button" class="ghost" id="clearCustomWorkout">Clear</button>
  </div>
  <form class="builder-form" id="customExerciseForm">
    <label class="builder-field builder-field-wide" for="customExerciseName">Exercise
      <input id="customExerciseName" autocomplete="off" placeholder="Bench press">
    </label>
    <label class="builder-field" for="customExerciseGroup">Group
      <select id="customExerciseGroup">
        <option>Warm Up</option>
        <option selected>Strength</option>
        <option>Chest</option>
        <option>Back</option>
        <option>Legs</option>
        <option>Shoulders</option>
        <option>Arms</option>
        <option>Core</option>
        <option>Cardio</option>
      </select>
    </label>
    <label class="builder-field" for="customExerciseSets">Sets
      <input id="customExerciseSets" type="number" inputmode="numeric" min="1" max="10" step="1" value="3">
    </label>
    <label class="builder-field" for="customExerciseReps">Target
      <input id="customExerciseReps" autocomplete="off" placeholder="8-10">
    </label>
    <label class="builder-field" for="customExerciseRest">Rest
      <select id="customExerciseRest">
        <option value="0">0s</option>
        <option value="45">45s</option>
        <option value="60" selected>60s</option>
        <option value="75">75s</option>
        <option value="90">90s</option>
        <option value="120">120s</option>
      </select>
    </label>
    <label class="builder-field builder-field-wide" for="customExerciseTrack">Track
      <select id="customExerciseTrack">
        <option value="weight" selected>Reps + weight</option>
        <option value="reps">Reps only</option>
        <option value="none">No inputs</option>
      </select>
    </label>
    <button type="submit" class="primary builder-add">Add Exercise</button>
  </form>
  <div class="builder-list" id="customBuilderList"></div>
  <div class="builder-note" id="customBuilderNote"></div>
</section>

<section class="current" aria-live="polite">
  <div class="current-main">
    <div>
      <div class="current-label" id="currentLabel">Current</div>
      <div class="current-title" id="currentTitle">Ready</div>
    </div>
    <div class="current-dose" id="currentDose">Tap a set to begin</div>
  </div>
  <div class="timer">
    <div>
      <div class="current-label">Rest Timer</div>
      <div class="timer-time" id="timerTime">01:30</div>
    </div>
  </div>
</section>

<div class="section-label">Workout</div>
<main class="exercise-list" id="exerciseList"></main>

<div class="complete-panel">
  <div class="complete-actions">
    <button type="button" class="primary" id="completeWorkout">Complete Workout</button>
    <button type="button" class="ghost" id="exportWorkoutData">Export Data</button>
  </div>
  <div class="complete-editor is-hidden" id="completeEditor">
    <label>Workout Time</label>
    <div class="complete-edit-row">
      <label class="complete-time-field" for="durationHours">Hours
        <input id="durationHours" type="number" inputmode="numeric" min="0" step="1">
      </label>
      <label class="complete-time-field" for="durationMinutes">Minutes
        <input id="durationMinutes" type="number" inputmode="numeric" min="0" max="59" step="1">
      </label>
      <button type="button" class="primary" id="saveCompleteWorkout">Save</button>
      <button type="button" class="ghost" id="cancelCompleteEdit">Cancel</button>
    </div>
  </div>
  <div class="save-note" id="saveNote"></div>
</div>

<section class="focus-screen" id="focusScreen" aria-hidden="true">
  <div class="focus-top">
    <button type="button" class="focus-back" id="exitFocus" aria-label="Back to workout plan">&#8249;</button>
    <div class="focus-status">
      <div class="focus-progress" id="focusProgress">0 / 0 sets</div>
      <div class="focus-elapsed" id="focusElapsed">00:00</div>
    </div>
  </div>
  <div class="focus-card">
    <div class="focus-main">
      <div class="focus-group" id="focusGroup">Current</div>
      <div class="focus-title" id="focusTitle">Ready</div>
      <div class="focus-set" id="focusSet">Set 1</div>
      <div class="focus-options">
        <button type="button" class="backup-toggle is-hidden" id="focusBackup"></button>
        <button type="button" class="skip-toggle is-hidden" id="focusSkip">Skip Exercise</button>
        <button type="button" class="add-set-toggle is-hidden" id="focusAddSet">Add Set</button>
        <button type="button" class="switch-ender-toggle is-hidden" id="focusSwitchEnder"></button>
      </div>
    </div>
    <div class="focus-rest">
      <div class="focus-timer-panel">
        <div class="current-label">Rest Timer</div>
        <div class="focus-time" id="focusTimerTime">00:45</div>
      </div>
      <div class="focus-inputs" id="focusInputs">
        <div class="focus-field">
          <label for="actualReps">Reps</label>
          <input id="actualReps" type="number" inputmode="numeric" min="0" placeholder="Reps">
        </div>
        <div class="focus-field weight-field" id="weightField">
          <label for="actualWeight">Weight</label>
          <input id="actualWeight" type="number" inputmode="decimal" min="0" step="0.5" placeholder="Lbs">
        </div>
      </div>
      <div class="focus-buttons">
        <button type="button" class="ghost focus-next is-hidden" id="focusNext">Next</button>
        <button type="button" class="primary focus-log" id="focusLogSet">Log Set</button>
      </div>
    </div>
  </div>
</section>

<script>
  const savedCustomPlan = JSON.parse(localStorage.getItem(customPlanKey) || 'null');
  window.liftWorkoutConfig = {
    title: 'Custom Workout',
    stateKey: 'standalone-lift-custom-state',
    historyKey: 'standalone-lift-custom-history',
    source: 'Lift Log - Custom Workout',
    exportPrefix: 'lift-custom',
    workout: savedCustomPlan?.workout?.length ? savedCustomPlan.workout : []
  };
</script>
<script src="../assets/js/workout-app.js?v=25"></script>
<script>
  const customStateKey = 'standalone-lift-custom-state';
  const customForm = document.getElementById('customExerciseForm');
  const customList = document.getElementById('customBuilderList');
  const customCount = document.getElementById('customWorkoutCount');
  const customNote = document.getElementById('customBuilderNote');
  const customName = document.getElementById('customExerciseName');
  const customGroup = document.getElementById('customExerciseGroup');
  const customSets = document.getElementById('customExerciseSets');
  const customReps = document.getElementById('customExerciseReps');
  const customRest = document.getElementById('customExerciseRest');
  const customTrack = document.getElementById('customExerciseTrack');
  const clearCustom = document.getElementById('clearCustomWorkout');
  let customExercises = savedCustomPlan?.workout?.length ? [...savedCustomPlan.workout] : [];

  function escapeCustomText(value) {
    return String(value).replace(/[&<>"']/g, character => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    }[character]));
  }

  function saveCustomPlan() {
    localStorage.setItem(customPlanKey, JSON.stringify({
      updatedAt: new Date().toISOString(),
      workout: customExercises
    }));
  }

  function renderCustomBuilder() {
    customCount.textContent = `${customExercises.length} exercise${customExercises.length === 1 ? '' : 's'}`;
    clearCustom.disabled = customExercises.length === 0;
    customList.innerHTML = customExercises.length ? customExercises.map((exercise, index) => `
      <div class="builder-item">
        <button type="button" class="builder-remove" data-index="${index}" aria-label="Remove ${escapeCustomText(exercise.name)}">Remove</button>
        <div>
          <div class="exercise-kicker">${escapeCustomText(exercise.group)}</div>
          <div class="builder-item-name">${escapeCustomText(exercise.name)}</div>
          <div class="builder-item-dose">${escapeCustomText(exercise.sets)} x ${escapeCustomText(exercise.reps)} · ${escapeCustomText(exercise.rest)}s rest</div>
        </div>
      </div>
    `).join('') : '<div class="builder-empty">Add the first exercise to start building.</div>';
  }

  customForm.addEventListener('submit', event => {
    event.preventDefault();
    const name = customName.value.trim();
    const reps = customReps.value.trim();
    if (!name || !reps) {
      customNote.textContent = 'Exercise and target are required.';
      return;
    }
    const exercise = {
      group: customGroup.value,
      name,
      sets: Math.max(1, Math.min(10, Number(customSets.value) || 1)),
      reps,
      rest: Number(customRest.value) || 0,
      track: customTrack.value
    };
    customExercises.push(exercise);
    saveCustomPlan();
    window.liftWorkoutApi?.addExercise(exercise);
    document.body.classList.remove('custom-empty');
    document.body.classList.add('custom-ready');
    customName.value = '';
    customReps.value = '';
    customSets.value = '3';
    customRest.value = '60';
    customTrack.value = 'weight';
    customNote.textContent = '';
    renderCustomBuilder();
    customName.focus();
  });

  customList.addEventListener('click', event => {
    const button = event.target.closest('.builder-remove');
    if (!button) return;
    const exerciseIndex = Number(button.dataset.index);
    if (!window.liftWorkoutApi?.removeExercise(exerciseIndex)) {
      customNote.textContent = 'Cannot remove an exercise after you start it.';
      return;
    }
    customExercises.splice(exerciseIndex, 1);
    if (customExercises.length) {
      saveCustomPlan();
    } else {
      localStorage.removeItem(customPlanKey);
      localStorage.removeItem(customStateKey);
      document.body.classList.remove('custom-ready');
      document.body.classList.add('custom-empty');
    }
    renderCustomBuilder();
  });

  clearCustom.addEventListener('click', () => {
    customExercises = [];
    localStorage.removeItem(customPlanKey);
    localStorage.removeItem(customStateKey);
    location.reload();
  });

  renderCustomBuilder();
</script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('../sw.js');
  }
</script>
</body>
</html>
