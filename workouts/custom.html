<script>
  const customPlanKey = 'standalone-lift-custom-workout-plan';
  const savedCustomWorkoutsKey = 'standalone-lift-saved-custom-workouts';
  const customRandomExercisePoolKey = 'standalone-lift-custom-random-exercise-pool';
  const savedWorkoutId = new URLSearchParams(window.location.search).get('saved');

  function readCustomJson(key, fallback) {
    try {
      return JSON.parse(localStorage.getItem(key) || JSON.stringify(fallback));
    } catch (error) {
      return fallback;
    }
  }

  const savedCustomWorkouts = readCustomJson(savedCustomWorkoutsKey, []);
  const selectedSavedWorkout = Array.isArray(savedCustomWorkouts)
    ? savedCustomWorkouts.find(workout => workout.id === savedWorkoutId)
    : null;
  const savedCustomPlan = selectedSavedWorkout || readCustomJson(customPlanKey, null);
  document.body.classList.add(savedCustomPlan?.workout?.length ? 'custom-ready' : 'custom-empty');
</script>

      { group: 'Arms', name: 'Alternating dumbbell curl + dumbbell overhead triceps extension', sets: 3, reps: '10-12 each', rest: 60, track: 'none' }
    ],
    Core: [
      { group: 'Core', name: 'Cable crunch', sets: 2, reps: '12-15', rest: 45, track: 'weight' },
      { group: 'Core', name: 'Hanging knee raise', sets: 2, reps: '8-12', rest: 45, track: 'none' },
      { group: 'Core', name: 'Ab wheel rollout', sets: 2, reps: '8-10', rest: 45, track: 'none' },
      { group: 'Core', name: 'Plank circuit', sets: 4, reps: 'Timed', rest: 0, track: 'none', setTargets: [
        { reps: 'Front plank 1:30', duration: 90 },
        { reps: 'Left side plank 1:30', duration: 90 },
        { reps: 'Right side plank 1:30', duration: 90 },
        { reps: 'Front plank 1:00', duration: 60 }
      ] }
    ],
    Cardio: [
      { group: 'Cardio', name: 'Stair stepper', sets: 1, reps: '10 min', rest: 0, track: 'none', duration: 600 },
      { group: 'Cardio', name: 'Stationary bike', sets: 1, reps: '10 min', rest: 0, track: 'none', duration: 600 },
      { group: 'Cardio', name: 'Incline treadmill walk', sets: 1, reps: '10 min', rest: 0, track: 'none', duration: 600 }
    ]
  };

  function escapeCustomText(value) {
    return String(value).replace(/[&<>"']/g, character => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    }[character]));
  }

  function categoryId(category) {
    return String(category).trim().toLowerCase().replace(/[^a-z0-9]+/g, '-') || 'custom';
  }

  function nextSavedWorkoutId() {
    if (window.crypto?.randomUUID) return window.crypto.randomUUID();
    return `custom-${Date.now()}-${Math.random().toString(16).slice(2)}`;
  }

  function exercisePoolName(value) {
    return String(value || '').trim().toLowerCase();
  }

  function cloneExercise(exercise) {
    return JSON.parse(JSON.stringify(exercise));
  }

  function normalizeRandomExercise(exercise) {
    if (!exercise?.name) return null;
    const group = String(exercise.group || 'Strength').trim() || 'Strength';
    const normalized = {
      group,
      name: String(exercise.name).trim(),
      sets: Math.max(1, Math.min(10, Number(exercise.sets) || 1)),
      reps: String(exercise.reps || 'Timed').trim(),
      rest: Math.max(0, Number(exercise.rest) || 0),
      track: ['weight', 'reps', 'none'].includes(exercise.track) ? exercise.track : 'none'
    };
    if (Number.isFinite(exercise.duration)) normalized.duration = exercise.duration;
    if (Array.isArray(exercise.setTargets)) normalized.setTargets = exercise.setTargets;
    return normalized.name ? normalized : null;
  }

  function ensureRandomCategoryOption(category) {
    if ([...randomCategory.options].some(option => option.value.toLowerCase() === category.toLowerCase())) return;
    const option = document.createElement('option');
    option.value = category;
    option.textContent = category;
    randomCategory.appendChild(option);
  }

  function ensureListCategoryOption(category) {
    if ([...listCategory.options].some(option => option.value.toLowerCase() === category.toLowerCase())) return;
    const option = document.createElement('option');
    option.value = category;
    option.textContent = category;
    listCategory.appendChild(option);
  }

  function syncPoolCategoryOptions() {
    Object.keys(randomExercisePool).forEach(category => {
      ensureRandomCategoryOption(category);
      ensureListCategoryOption(category);
    });
    renderListExercises();
  }

  function saveCustomRandomExercisePool() {
    localStorage.setItem(customRandomExercisePoolKey, JSON.stringify(customRandomExercisePool));
  }

  function mergeRandomExercise(exercise, shouldPersist = true) {
    const normalized = normalizeRandomExercise(exercise);
    if (!normalized) return false;
    const category = normalized.group;
    randomExercisePool[category] = randomExercisePool[category] || [];
    ensureRandomCategoryOption(category);
    ensureListCategoryOption(category);
    const exists = randomExercisePool[category].some(option => exercisePoolName(option.name) === exercisePoolName(normalized.name));
    if (exists) return false;
    randomExercisePool[category].push(normalized);
    if (shouldPersist) {
      customRandomExercisePool[category] = customRandomExercisePool[category] || [];
      customRandomExercisePool[category].push(normalized);
    }
    return true;
  }

  function mergeWorkoutExercisesIntoRandomPool(workouts) {
    let added = 0;
    workouts.forEach(workout => {
      (workout.workout || []).forEach(exercise => {
        if (mergeRandomExercise(exercise)) added += 1;
      });
    });
    if (added) saveCustomRandomExercisePool();
    return added;
  }

  function hydrateCustomRandomExercisePool() {
    Object.values(customRandomExercisePool || {}).flat().forEach(exercise => {
      mergeRandomExercise(exercise, false);
    });
  }

  function savedCategories() {
    const defaults = ['Push', 'Upper / Full', 'Legs / Mixed'];
    const customCategories = savedWorkoutStore
      .map(workout => workout.category)
      .filter(Boolean);
    return [...new Map([...defaults, ...customCategories].map(category => [category.toLowerCase(), category])).values()];
  }

  function saveSavedWorkoutStore() {
    localStorage.setItem(savedCustomWorkoutsKey, JSON.stringify(savedWorkoutStore));
  }

  function renderSavedCategoryOptions() {
    const currentCategory = selectedSavedWorkout?.category || savedWorkoutCategory.value || 'Push';
    const categories = savedCategories();
    savedWorkoutCategory.innerHTML = categories.map(category => (
      `<option value="${escapeCustomText(category)}">${escapeCustomText(category)}</option>`
    )).join('') + '<option value="__new">New category</option>';
    savedWorkoutCategory.value = categories.some(category => category.toLowerCase() === currentCategory.toLowerCase())
      ? currentCategory
      : '__new';
    if (savedWorkoutCategory.value === '__new') {
      newWorkoutCategory.value = currentCategory;
    }
  }

  function saveCustomPlan() {
    if (selectedSavedWorkout) return;
    localStorage.setItem(customPlanKey, JSON.stringify({
      updatedAt: new Date().toISOString(),
      workout: customExercises
    }));
  }

  function addCustomExercise(exercise) {
    customExercises.push(exercise);
    saveCustomPlan();
    window.liftWorkoutApi?.addExercise(exercise);
    document.body.classList.remove('custom-empty');
    document.body.classList.add('custom-ready');
    customNote.textContent = '';
    renderCustomBuilder();
  }

  function randomExercise(category, excludeName = '') {
    const options = randomExercisePool[category] || [];
    if (!options.length) return null;
    const unused = options.filter(option => !customExercises.some(exercise => exercise.name === option.name));
    const baseCandidates = unused.length ? unused : options;
    const rerollCandidates = baseCandidates.filter(option => exercisePoolName(option.name) !== exercisePoolName(excludeName));
    const candidates = rerollCandidates.length ? rerollCandidates : baseCandidates;
    return cloneExercise(candidates[Math.floor(Math.random() * candidates.length)]);
  }

  function rollRandomExercise() {
    pendingRandomExercise = randomExercise(randomCategory.value, pendingRandomExercise?.name);
    renderRandomPreview();
  }

  function renderRandomPreview() {
    addRandom.disabled = !pendingRandomExercise;
    randomPreview.innerHTML = pendingRandomExercise ? `
      <div class="exercise-kicker">${escapeCustomText(pendingRandomExercise.group)}</div>
      <div class="builder-random-preview-name">${escapeCustomText(pendingRandomExercise.name)}</div>
      <div class="builder-random-preview-dose">${escapeCustomText(pendingRandomExercise.sets)} x ${escapeCustomText(pendingRandomExercise.reps)} · ${escapeCustomText(pendingRandomExercise.rest)}s rest</div>
    ` : '<div class="builder-empty">Nothing available for this group.</div>';
  }

  function listedExercise(category, name) {
    const options = randomExercisePool[category] || [];
    const exercise = options.find(option => option.name === name);
    return exercise ? cloneExercise(exercise) : null;
  }

  function renderListExercises() {
    const options = randomExercisePool[listCategory.value] || [];
    listExerciseName.innerHTML = options.map(exercise => (
      `<option value="${escapeCustomText(exercise.name)}">${escapeCustomText(exercise.name)}</option>`
    )).join('');
    addListed.disabled = options.length === 0;
  }

  function renderCustomBuilder() {
    customCount.textContent = `${customExercises.length} exercise${customExercises.length === 1 ? '' : 's'}`;
    clearCustom.disabled = customExercises.length === 0;
    customList.innerHTML = customExercises.length ? customExercises.map((exercise, index) => `
      <div class="builder-item">
        <div>
          <div class="exercise-kicker">${escapeCustomText(exercise.group)}</div>
          <div class="builder-item-name">${escapeCustomText(exercise.name)}</div>
          <div class="builder-item-dose">${escapeCustomText(exercise.sets)} x ${escapeCustomText(exercise.reps)} · ${escapeCustomText(exercise.rest)}s rest</div>
        </div>
        <button type="button" class="builder-remove" data-index="${index}" aria-label="Remove ${escapeCustomText(exercise.name)}">Remove</button>
      </div>
    `).join('') : '<div class="builder-empty">Add the first exercise to start building.</div>';
  }

  function normalizeSavedWorkout(workout) {
    if (!workout?.name || !Array.isArray(workout.workout) || !workout.workout.length) return null;
    return {
      id: workout.id || nextSavedWorkoutId(),
      name: String(workout.name).trim(),
      category: String(workout.category || 'Custom').trim() || 'Custom',
      createdAt: workout.createdAt || new Date().toISOString(),
      updatedAt: workout.updatedAt || new Date().toISOString(),
      workout: workout.workout
    };
  }

  function exportSavedWorkouts() {
    const payload = {
      app: 'Liftin',
      type: 'custom-workout-layouts',
      codexImportMode: 'normal-workout-page',
      note: 'When this file is given to Codex, promote these layouts into normal checked-in workout pages instead of local saved custom workouts.',
      exportedAt: new Date().toISOString(),
      workouts: savedWorkoutStore
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `liftin-workout-export-${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(link);
    link.click();
    link.remove();
    URL.revokeObjectURL(link.href);
    customNote.textContent = `Exported ${savedWorkoutStore.length} saved workout${savedWorkoutStore.length === 1 ? '' : 's'}.`;
  }

  customForm.addEventListener('submit', event => {
    event.preventDefault();
    const name = customName.value.trim();
    const reps = customReps.value.trim();
    if (!name || !reps) {
      customNote.textContent = 'Exercise and target are required.';
      return;
    }
    const exercise = {
      group: customGroup.value,
      name,
      sets: Math.max(1, Math.min(10, Number(customSets.value) || 1)),
      reps,
      rest: Number(customRest.value) || 0,
      track: customTrack.value
    };
    addCustomExercise(exercise);
    customName.value = '';
    customReps.value = '';
    customSets.value = '3';
    customRest.value = '60';
    customTrack.value = 'weight';
    customName.focus();
  });

  addModeButtons.forEach(button => {
    button.addEventListener('click', () => {
      addModeButtons.forEach(modeButton => modeButton.classList.toggle('is-active', modeButton === button));
      addModePanels.forEach(panel => {
        panel.classList.toggle('is-hidden', panel.dataset.modePanel !== button.dataset.addMode);
      });
      if (button.dataset.addMode === 'write') customName.focus();
      if (button.dataset.addMode === 'pick') listExerciseName.focus();
      if (button.dataset.addMode === 'shuffle') {
        rollRandomExercise();
        randomCategory.focus();
      }
    });
  });

  listCategory.addEventListener('change', renderListExercises);

  addListed.addEventListener('click', () => {
    const exercise = listedExercise(listCategory.value, listExerciseName.value);
    if (!exercise) {
      customNote.textContent = 'No exercise selected.';
      return;
    }
    addCustomExercise(exercise);
  });

  randomCategory.addEventListener('change', rollRandomExercise);
  rollRandom.addEventListener('click', rollRandomExercise);

  addRandom.addEventListener('click', () => {
    if (!pendingRandomExercise) {
      customNote.textContent = 'No exercises available for that category.';
      return;
    }
    addCustomExercise(cloneExercise(pendingRandomExercise));
    rollRandomExercise();
  });

  customList.addEventListener('click', event => {
    const button = event.target.closest('.builder-remove');
    if (!button) return;
    const exerciseIndex = Number(button.dataset.index);
    if (!window.liftWorkoutApi?.removeExercise(exerciseIndex)) {
      customNote.textContent = 'Cannot remove an exercise after you start it.';
      return;
    }
    customExercises.splice(exerciseIndex, 1);
    if (customExercises.length) {
      saveCustomPlan();
    } else {
      if (!selectedSavedWorkout) localStorage.removeItem(customPlanKey);
      localStorage.removeItem(customStateKey);
      document.body.classList.remove('custom-ready');
      document.body.classList.add('custom-empty');
    }
    renderCustomBuilder();
  });

  clearCustom.addEventListener('click', () => {
    customExercises = [];
    if (!selectedSavedWorkout) localStorage.removeItem(customPlanKey);
    localStorage.removeItem(customStateKey);
    location.reload();
  });

  showSaveWorkoutOptions.addEventListener('click', () => {
    saveCustomWorkoutForm.hidden = !saveCustomWorkoutForm.hidden;
    if (!saveCustomWorkoutForm.hidden) {
      savedWorkoutName.focus();
    }
  });

  savedWorkoutCategory.addEventListener('change', () => {
    newWorkoutCategory.disabled = savedWorkoutCategory.value !== '__new';
    if (savedWorkoutCategory.value !== '__new') {
      newWorkoutCategory.value = '';
    }
  });

  saveCustomWorkoutForm.addEventListener('submit', event => {
    event.preventDefault();
    const name = savedWorkoutName.value.trim();
    const category = savedWorkoutCategory.value === '__new'
      ? newWorkoutCategory.value.trim()
      : savedWorkoutCategory.value.trim();
    if (!customExercises.length) {
      customNote.textContent = 'Add at least one exercise before saving.';
      return;
    }
    if (!name || !category) {
      customNote.textContent = 'Name and category are required.';
      return;
    }
    const existingIndex = activeSavedWorkoutId
      ? savedWorkoutStore.findIndex(workout => workout.id === activeSavedWorkoutId)
      : -1;
    const existing = existingIndex >= 0 ? savedWorkoutStore[existingIndex] : null;
    const savedWorkout = {
      id: existing?.id || nextSavedWorkoutId(),
      name,
      category,
      createdAt: existing?.createdAt || new Date().toISOString(),
      updatedAt: new Date().toISOString(),
      workout: customExercises
    };
    if (existingIndex >= 0) {
      savedWorkoutStore[existingIndex] = savedWorkout;
    } else {
      savedWorkoutStore.push(savedWorkout);
    }
    activeSavedWorkoutId = savedWorkout.id;
    const addedExercises = mergeWorkoutExercisesIntoRandomPool([savedWorkout]);
    saveSavedWorkoutStore();
    renderSavedCategoryOptions();
    saveCustomWorkoutForm.hidden = true;
    customNote.textContent = `Saved ${name} to ${category}${addedExercises ? ` · added ${addedExercises} random option${addedExercises === 1 ? '' : 's'}` : ''}.`;
  });

  exportCustomLayouts.addEventListener('click', () => {
    if (!savedWorkoutStore.length) {
      customNote.textContent = 'No saved workouts to export yet.';
      return;
    }
    exportSavedWorkouts();
  });

  deleteSavedWorkout.addEventListener('click', () => {
    if (!activeSavedWorkoutId) return;
    savedWorkoutStore = savedWorkoutStore.filter(workout => workout.id !== activeSavedWorkoutId);
    saveSavedWorkoutStore();
    localStorage.removeItem(customStateKey);
    customNote.textContent = 'Removed from home screen.';
    window.location.href = '../index.html';
  });

  if (selectedSavedWorkout) {
    document.title = selectedSavedWorkout.name;
    customWorkoutTitle.textContent = selectedSavedWorkout.name;
    const cancelDeleteReveal = () => {
      if (deleteRevealTimer) {
        clearTimeout(deleteRevealTimer);
        deleteRevealTimer = null;
      }
    };
    const startDeleteReveal = () => {
      cancelDeleteReveal();
      deleteRevealTimer = setTimeout(() => {
        deleteSavedWorkout.hidden = false;
        customNote.textContent = 'Delete unlocked.';
      }, 700);
    };
    builderSave.addEventListener('pointerdown', startDeleteReveal);
    builderSave.addEventListener('pointerup', cancelDeleteReveal);
    builderSave.addEventListener('pointerleave', cancelDeleteReveal);
    builderSave.addEventListener('pointercancel', cancelDeleteReveal);
  }
  savedWorkoutName.value = selectedSavedWorkout?.name || '';
  hydrateCustomRandomExercisePool();
  syncPoolCategoryOptions();
  rollRandomExercise();
  renderSavedCategoryOptions();
  newWorkoutCategory.disabled = savedWorkoutCategory.value !== '__new';
  renderCustomBuilder();
</script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('../sw.js');
  }
</script>
</body>
</html>
